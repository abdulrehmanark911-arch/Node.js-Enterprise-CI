name: Node.js Enterprise CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-application:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Har command ko alag step mein rakh diya taake indentation ka mazaq na bane
      - name: Setup Message
        run: echo "Setting up Node.js Environment..."

      - name: Check Node Version
        run: node -v

      - name: Install Dependencies Mock
        run: echo "Dependencies installed successfully!"

      - name: Run Tests Mock
        run: echo "All automated tests passed!"
