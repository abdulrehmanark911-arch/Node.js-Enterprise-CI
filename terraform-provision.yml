name: Terraform Infrastructure Management

on:
  workflow_dispatch: # Manual trigger template for DevOps Control

jobs:
  # JOB 1: Code ki checking karna
  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform Utility
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init and Validate
        run: |
          echo "Initializing Terraform backend..."
          echo "Running: terraform init"
          echo "Validating infrastructure configurations..."
          echo "Running: terraform validate"
          echo "Code linting and validation successful!"

  # JOB 2: Actual Deployment (Sirf tab chalegi jab Job 1 pass ho)
  deploy-infra:
    runs-on: ubuntu-latest
    needs: validate-infra # 🔗 Dependency System
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform Utility
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Infrastructure Apply
        run: |
          echo "Applying infrastructure state securely..."
          # Real command: terraform apply -auto-approve
          echo "Terraform completed! Resources provisioned successfully."
