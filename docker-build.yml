name: Docker Build & Publish Platform

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 🔐 Step B: Docker Hub par securely login karna secrets use karte hue
      - name: Log in to Docker Hub Securely
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🛠️ Step C: Docker Image tayyar karna
      - name: Build Docker Image
        run: |
          echo "Building Docker image for the forge-platform..."
          docker build -t ${{ secrets.DOCKER_USERNAME }}/forge-platform:latest .

      # 🚀 Step D: Registry par image ko push karna
      - name: Push Image to Registry
        run: |
          echo "Pushing image to Docker Hub registry..."
          docker push ${{ secrets.DOCKER_USERNAME }}/forge-platform:latest
