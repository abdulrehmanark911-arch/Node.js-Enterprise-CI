name: 02 Docker Build & Push

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub Securely
        uses: docker/login-action@v3
        with:
          username: aban961                         # ✅ Aapka sahi username
          password: ${{ secrets.DOCKER_PASSWORD }} # ✅ GitHub Settings wala password

      - name: Build Docker Image
        run: |
          echo "Building Docker image..."
          docker build -t aban961/forge-platform:latest .

      - name: Push Image to Registry
        run: |
          echo "Pushing image to Docker Hub..."
          docker push aban961/forge-platform:latest